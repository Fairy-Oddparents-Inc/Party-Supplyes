name: Code Quality & Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'supparty/package-lock.json'

      - name: Instalar dependencias
        run: npm ci
        working-directory: supparty

      - name: Ejecutar Linter
        run: npm run lint
        working-directory: supparty

      # Descomentar cuando configures pruebas
      # - name: Ejecutar Tests
      #   run: npm test
      #   working-directory: supparty
